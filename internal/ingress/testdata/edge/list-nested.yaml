apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: List
    items:
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: nested
          namespace: edge
        spec:
          rules:
            - host: nested.example.com
              http:
                paths:
                  - path: /nested
                    pathType: Prefix
  - apiVersion: v1
    kind: Service
    metadata:
      name: checkout
      namespace: edge
    spec:
      ports:
        - port: 80
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: settings
      namespace: edge
    data:
      retries: "3"
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: sibling
      namespace: edge
    spec:
      rules:
        - host: sibling.example.com
          http:
            paths:
              - path: /sibling
                pathType: Prefix
