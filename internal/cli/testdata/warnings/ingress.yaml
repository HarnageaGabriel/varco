apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: varco
  name: wildcard-one
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: perhaps
    nginx.ingress.kubernetes.io/ssl-redirect: maybe
spec:
  rules:
    - host: "*.one.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: one
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: varco
  name: wildcard-two
spec:
  rules:
    - host: "*.two.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: two
                port:
                  number: 80
