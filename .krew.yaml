apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: varco
spec:
  version: v0.1.2
  homepage: https://github.com/HarnageaGabriel/varco
  shortDescription: Compare HTTP endpoint behavior across two deployments.
  description: |
    varco derives probe cases from Kubernetes Ingress resources, sends the same
    requests to two endpoints, and reports behavior differences without
    translating manifests or modifying either endpoint.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.2/varco_0.1.2_linux_amd64.tar.gz
      sha256: 6ba2f38451e030de26696ffda3f31d6eb7b8615491b061da8e7a682736020f7d
      bin: varco
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.2/varco_0.1.2_linux_arm64.tar.gz
      sha256: d77a4c28c0d7a518a8cbebc7371a5275f5bc2742f4ec0004adcb4e927b9d4c5f
      bin: varco
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.2/varco_0.1.2_darwin_amd64.tar.gz
      sha256: f0aaf325b30168cb192d7d8f6f486357e25d46752e6e01171ec7e4a2ac9c16a6
      bin: varco
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.2/varco_0.1.2_darwin_arm64.tar.gz
      sha256: 87eaf4301bba830ffe3a6e7a4f3db66a9f6800b76b8f5367780b37e89036a406
      bin: varco
    - selector:
        matchLabels:
          os: windows
