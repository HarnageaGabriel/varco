apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: varco
spec:
  version: v0.1.0
  homepage: https://github.com/HarnageaGabriel/varco
  shortDescription: Compare HTTP endpoint behavior across two deployments.
  description: |
    varco derives probe cases from Kubernetes Ingress resources, sends the same
    requests to two endpoints, and reports behavior differences without
    translating manifests or modifying either endpoint.
  caveats: |
    Release archive hashes must be updated from v0.1.0 checksums.txt before
    this manifest is published to a Krew index.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.0/varco_0.1.0_linux_amd64.tar.gz
      sha256: UPDATE_FROM_RELEASE_CHECKSUMS_BEFORE_PUBLISH
      bin: varco
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.0/varco_0.1.0_linux_arm64.tar.gz
      sha256: UPDATE_FROM_RELEASE_CHECKSUMS_BEFORE_PUBLISH
      bin: varco
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.0/varco_0.1.0_darwin_amd64.tar.gz
      sha256: UPDATE_FROM_RELEASE_CHECKSUMS_BEFORE_PUBLISH
      bin: varco
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.0/varco_0.1.0_darwin_arm64.tar.gz
      sha256: UPDATE_FROM_RELEASE_CHECKSUMS_BEFORE_PUBLISH
      bin: varco
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.0/varco_0.1.0_windows_amd64.zip
      sha256: UPDATE_FROM_RELEASE_CHECKSUMS_BEFORE_PUBLISH
      bin: varco.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/HarnageaGabriel/varco/releases/download/v0.1.0/varco_0.1.0_windows_arm64.zip
      sha256: UPDATE_FROM_RELEASE_CHECKSUMS_BEFORE_PUBLISH
      bin: varco.exe
