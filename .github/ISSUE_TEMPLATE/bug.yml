name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use private vulnerability reporting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and exact output with secrets removed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest command that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Output of varco version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS and architecture
    validations:
      required: true
