# Source: https://kubernetes.io/blog/2026/02/27/ingress-nginx-before-you-migrate
# Blog behavior 3: rewrite-target silently enables regex matching for every path
# of the host, and rewrites the upstream request path.
# Anonymized: shop catalog with CORS enabled and two annotations varco cannot
# test black-box.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: shop
  name: catalog
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "X-Request-Id, X-Tenant"
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
    nginx.ingress.kubernetes.io/auth-type: basic
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /catalog(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalog
                port:
                  number: 8080
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: cart
                port:
                  number: 8080
