apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: varco-demo
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  rules:
    - host: demo.example.com
      http:
        paths:
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: health
                port:
                  number: 80
